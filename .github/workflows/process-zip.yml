name: Process ZIP Inbox

on:
  push:
    paths:
      - "_inbox/*.zip"

permissions:
  contents: write

jobs:
  process-zip:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Find uploaded ZIP
        run: |
          ZIP_FILE=$(find _inbox -maxdepth 1 -type f -name "*.zip" | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "No ZIP file found."
            exit 1
          fi

          echo "ZIP_FILE=$ZIP_FILE" >> "$GITHUB_ENV"
          echo "Found: $ZIP_FILE"

      - name: Extract ZIP
        run: |
          mkdir -p extracted
          unzip -o "$ZIP_FILE" -d extracted

      - name: Copy extracted files
        run: |
          NAME=$(basename "$ZIP_FILE" .zip)
          mkdir -p "output/$NAME"
          cp -r extracted/. "output/$NAME/"

      - name: Remove processed ZIP
        run: |
          rm -f "$ZIP_FILE"
          rm -rf extracted

      - name: Commit extracted files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add .

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "Automatically extract uploaded ZIP"
          git pull --rebase
          git push
